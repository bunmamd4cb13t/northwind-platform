name: oidc-probe
on: { workflow_dispatch: {} }
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          echo "$T" | python3 -c "import sys,json,base64;t=json.load(sys.stdin)['value'];p=t.split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print('CLAIM-SUB',c['sub']);print('CLAIM-AUD',c['aud']);print('CLAIM-ISS',c['iss'])"
